<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Seapruma">
  <!-- Disable browser caching of entrypoint for transparent updates -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Seapruma">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="theme-color" content="#1a1110">

  <!-- Fonts preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Seapruma</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body,
    flutter-view,
    canvas {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #1a1110;
      opacity: 1 !important;
      display: block !important;
    }
  </style>

  <script>
    // 1. Interceptador de Fetch: Força revalidação HTTP (cache: 'no-cache') em todos os arquivos de runtime, WASM e assets do Flutter Web
    (function () {
      var originalFetch = window.fetch;
      if (!originalFetch) return;

      window.fetch = function (resource, init) {
        init = init || {};
        var urlStr = '';
        if (typeof resource === 'string') {
          urlStr = resource;
        } else if (resource && resource.href) {
          urlStr = resource.href;
        } else if (resource && resource.url) {
          urlStr = resource.url;
        }
        if (
          urlStr.indexOf('main.dart') !== -1 ||
          urlStr.indexOf('skwasm') !== -1 ||
          urlStr.indexOf('canvaskit') !== -1 ||
          urlStr.indexOf('Manifest') !== -1 ||
          urlStr.indexOf('version.json') !== -1 ||
          urlStr.indexOf('flutter_bootstrap') !== -1 ||
          urlStr.endsWith('.wasm') ||
          urlStr.endsWith('.mjs')
        ) {
          init.cache = 'no-cache';
        }
        return originalFetch.call(this, resource, init);
      };
    })();

    // 2. Limpeza proativa de Service Workers e Caches do navegador ao inicializar
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function (keys) {
        keys.forEach(function (key) {
          caches.delete(key);
        });
      });
    }

    // 3. Função global para limpar Service Workers, Caches e recarregar o app com parâmetro de cache-bust na URL
    window.clearAppCacheAndReload = function () {
      console.log('[PWA] Limpando caches e desregistrando Service Workers...');
      var reloadWithCacheBust = function () {
        var url = new URL(window.location.href);
        url.searchParams.set('_pwa_refresh', Date.now());
        window.location.href = url.toString();
      };

      var promises = [];
      if ('serviceWorker' in navigator) {
        promises.push(
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            return Promise.all(registrations.map(function (r) { return r.unregister(); }));
          })
        );
      }
      if ('caches' in window) {
        promises.push(
          caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) { return caches.delete(key); }));
          })
        );
      }
      Promise.all(promises).then(function () {
        console.log('[PWA] Caches limpos! Recarregando...');
        reloadWithCacheBust();
      }).catch(function () {
        reloadWithCacheBust();
      });
    };

    // 4. Monitor e Recuperador de Inicialização do Flutter / PWA
    (function () {
      var flutterLoaded = false;

      function isFlutterMounted() {
        return !!(document.querySelector('flutter-view') || document.querySelector('canvas'));
      }

      function handleBootFailure(reason) {
        if (isFlutterMounted()) return;
        var attempts = parseInt(sessionStorage.getItem('_pwa_recovery_attempts') || '0', 10);
        if (attempts < 2) {
          sessionStorage.setItem('_pwa_recovery_attempts', (attempts + 1).toString());
          console.warn('[PWA] Recuperando automaticamente de falha de boot (' + reason + ', tentativa ' + (attempts + 1) + ')...');
          if (window.clearAppCacheAndReload) {
            window.clearAppCacheAndReload();
          } else {
            window.location.reload();
          }
        } else {
          console.error('[PWA] Falha persistente ao carregar o aplicativo após atualização (' + reason + ').');
        }
      }

      // Escuta criação do canvas / view
      const observer = new MutationObserver(function (mutations) {
        if (isFlutterMounted()) {
          flutterLoaded = true;
          sessionStorage.removeItem('_pwa_recovery_attempts');
        }
        for (const mutation of mutations) {
          for (const node of mutation.addedNodes) {
            if (node.nodeName === 'CANVAS') {
              attachWebGLProtection(node);
            } else if (node.querySelectorAll) {
              const canvases = node.querySelectorAll('canvas');
              canvases.forEach(attachWebGLProtection);
            }
          }
        }
      });

      document.addEventListener('DOMContentLoaded', function () {
        observer.observe(document.body, { childList: true, subtree: true });
        document.querySelectorAll('canvas').forEach(attachWebGLProtection);
      });

      // Trata erros não capturados durante a inicialização (ex: incompatibilidade de WASM/JS em cache)
      window.addEventListener('unhandledrejection', function (event) {
        if (!flutterLoaded && !isFlutterMounted()) {
          console.error('[PWA/Boot Error] Unhandled rejection durante boot:', event.reason);
          handleBootFailure('unhandledrejection');
        }
      });

      window.addEventListener('error', function (event) {
        if (!flutterLoaded && !isFlutterMounted()) {
          console.error('[PWA/Boot Error] Erro global durante boot:', event.error || event.message);
          handleBootFailure('global error');
        }
      });

      // Timeout de segurança: Se após 8 segundos o Flutter não tiver renderizado a tela
      setTimeout(function () {
        if (!flutterLoaded && !isFlutterMounted()) {
          console.warn('[PWA] Timeout de inicialização do Flutter (8s).');
          handleBootFailure('timeout 8s');
        }
      }, 8000);

      // Função para anexar os listeners no canvas do Flutter/Skwasm
      function attachWebGLProtection(canvas) {
        if (canvas._hasWebGLProtection) return;
        canvas._hasWebGLProtection = true;

        canvas.addEventListener('webglcontextlost', function (event) {
          event.preventDefault();
          console.warn('[PWA/Flutter] WebGL Context Lost detectado. Recarregando app...');
          window.location.reload();
        }, false);
      }

      // Fallback por Ciclo de Vida: Checa se a página voltou do segundo plano
      let hiddenTime = 0;
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') {
          hiddenTime = Date.now();
        } else if (document.visibilityState === 'visible') {
          const timeBackground = Date.now() - hiddenTime;
          if (hiddenTime > 0 && timeBackground > 300000) {
            console.warn('[PWA/Flutter] Retornando após tempo prolongado em background. Recarregando...');
            window.location.reload();
          }
        }
      });
    })();
  </script>
</head>

<body>
  <script>
    (function () {
      var script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?v=' + new Date().getTime();
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>

</html>
